  name: Deploy React Frontend to S3

  on:
    push:
      branches:
        - main

  permissions:
    id-token: write
    contents: read

  jobs:
    deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Build React application
          run: npm run build

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ap-south-1

        - name: Upload index.html
          run: aws s3 cp dist/index.html s3://unifeed-social-networking/index.html

        - name: Upload logo.svg
          run: aws s3 cp dist/logo.svg s3://unifeed-social-networking/logo.svg

        - name: Upload assets
          run: aws s3 sync dist/assets/ s3://unifeed-social-networking/assets/